<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 170" width="836" height="170" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="836" height="170" rx="14" fill="#0d1117"/>
  <text x="20" y="32" fill="#e6edf3" font-size="15" font-weight="bold">One key press, end to end</text>
  <rect x="20" y="50" width="118" height="70" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="79" y="80" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">Keyboard</text>
  <text x="79" y="100" text-anchor="middle" fill="#8b949e" font-size="10">w a s d e</text>
  <line x1="140" y1="85" x2="154" y2="85" stroke="#30363d" stroke-width="2"/>
  <rect x="156" y="50" width="118" height="70" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="215" y="80" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">TeleopCommand</text>
  <text x="215" y="100" text-anchor="middle" fill="#8b949e" font-size="10">teleop/command</text>
  <line x1="276" y1="85" x2="290" y2="85" stroke="#30363d" stroke-width="2"/>
  <rect x="292" y="50" width="118" height="70" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="351" y="80" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">Gates</text>
  <text x="351" y="100" text-anchor="middle" fill="#8b949e" font-size="10">engaged? fresh? finite?</text>
  <line x1="412" y1="85" x2="426" y2="85" stroke="#30363d" stroke-width="2"/>
  <rect x="428" y="50" width="118" height="70" rx="10" fill="#161b22" stroke="#14b8a6" stroke-width="2"/>
  <text x="487" y="80" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">IK + limits</text>
  <text x="487" y="100" text-anchor="middle" fill="#8b949e" font-size="10">pure C++ core</text>
  <line x1="548" y1="85" x2="562" y2="85" stroke="#30363d" stroke-width="2"/>
  <rect x="564" y="50" width="118" height="70" rx="10" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <text x="623" y="80" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">JointState</text>
  <text x="623" y="100" text-anchor="middle" fill="#8b949e" font-size="10">joint_states</text>
  <line x1="684" y1="85" x2="698" y2="85" stroke="#30363d" stroke-width="2"/>
  <rect x="700" y="50" width="118" height="70" rx="10" fill="#161b22" stroke="#f5a623" stroke-width="2"/>
  <text x="759" y="80" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">TF</text>
  <text x="759" y="100" text-anchor="middle" fill="#8b949e" font-size="10">robot_state_publisher</text>
  <circle r="5" cy="85" fill="#f5a623">
    <animate attributeName="cx" values="20;816" dur="4.5s" begin="0.0s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#58a6ff;#a371f7;#d29922;#14b8a6;#2ea043;#f5a623" dur="4.5s" begin="0.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;1;0" dur="4.5s" begin="0.0s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" cy="85" fill="#f5a623">
    <animate attributeName="cx" values="20;816" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#58a6ff;#a371f7;#d29922;#14b8a6;#2ea043;#f5a623" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;1;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" cy="85" fill="#f5a623">
    <animate attributeName="cx" values="20;816" dur="4.5s" begin="3.0s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#58a6ff;#a371f7;#d29922;#14b8a6;#2ea043;#f5a623" dur="4.5s" begin="3.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;1;0" dur="4.5s" begin="3.0s" repeatCount="indefinite"/>
  </circle>
  <text x="20" y="150" fill="#8b949e" font-size="11">Keyboard: Python node (publishes at 50 Hz)   ·   controller: C++ node, 50 Hz timer   ·   a stale or missing command stops motion at the gates</text>
</svg>
